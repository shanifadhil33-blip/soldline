name: Tick
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call tick
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -n "$TICK_URL" ] && [ -n "$TICK_SECRET" ]; then
            curl --silent --output /dev/null --max-time 30 --request POST --header "Authorization: Bearer $TICK_SECRET" "$TICK_URL" || true
          fi
